<nav class="topbar">

    <div>
        <h4 class="page-title">ADMIN PANEL </h4>
    </div>

    <div class="topbar-actions">

        <div class="search-box">
            <i class="bi bi-search"></i>
<input
    type="text"
    class="form-control"
    placeholder="Search students, events..."
    [(ngModel)]="searchText"
    (keyup)="search()">       
     </div>

        <button class="icon-btn" title="Notifications">
            <i class="bi bi-bell"></i>
            <span class="dot"></span>
        </button>

        <div class="divider"></div>

      <div
    class="user-chip"
    role="button"
    style="cursor:pointer;"
    (click)="viewProfile()"
    data-bs-toggle="modal"
    data-bs-target="#profileModal">

    <div class="avatar">
        {{ admin?.name?.charAt(0).toUpperCase() }}
    </div>

    <div class="user-meta">

        <p class="user-name">
            {{ admin?.name }}
        </p>

        <p class="user-role">
            Administrator
        </p>

    </div>

</div>

        <button class="btn-logout" title="Logout" (click)="logout()">
            <i class="bi bi-box-arrow-right"></i>
        </button>

    </div>

    



</nav>


<!-- ================= My Profile Modal ================= -->
<div class="modal fade" id="profileModal" tabindex="-1">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header text-white" style="background:#2563EB;">

                <h5 class="modal-title">
                    <i class="bi bi-person-circle me-2"></i>
                    My Profile
                </h5>

                <button
                    type="button"
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Name
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        [(ngModel)]="editProfileData.name">

                </div>

                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Email
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        [(ngModel)]="editProfileData.email">

                </div>

            </div>

            <div class="modal-footer">
<button
    type="button"
    class="btn btn-primary"
    (click)="openChangePassword()"
     data-bs-toggle="modal"
    data-bs-target="#changePasswordModal">

    Change Password

</button>
                <button
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Cancel

                </button>

                <button
                    class="btn btn-primary"
                    (click)="updateProfile()">

                    <i class="bi bi-check-circle me-1"></i>

                    Update Profile

                </button>

            </div>

        </div>

    </div>

</div>

<!-- ================= Change Password Modal ================= -->

<div
    class="modal fade"
    id="changePasswordModal"
    tabindex="-1"
    aria-labelledby="changePasswordModalLabel"
    aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <!-- Header -->

            <div
                class="modal-header text-white"
                style="background:#2563EB;">

                <h5
                    class="modal-title"
                    id="changePasswordModalLabel">

                    <i class="bi bi-shield-lock me-2"></i>

                    Change Password

                </h5>

                <button
                    type="button"
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <!-- Body -->

            <div class="modal-body">

                <!-- Current Password -->

                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Current Password
                    </label>

                    <div class="input-group">

                        <input
                            [type]="showCurrentPassword ? 'text' : 'password'"
                            class="form-control"
                            [(ngModel)]="changePasswordData.current_password"
                            placeholder="Enter current password">

                        <button
                            type="button"
                            class="btn btn-outline-secondary"
                            (click)="showCurrentPassword = !showCurrentPassword">

                            <i
                                class="bi"
                                [class.bi-eye]="!showCurrentPassword"
                                [class.bi-eye-slash]="showCurrentPassword">
                            </i>

                        </button>

                    </div>

                </div>

                <!-- New Password -->

                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        New Password
                    </label>

                    <div class="input-group">

                        <input
                            [type]="showNewPassword ? 'text' : 'password'"
                            class="form-control"
                            [(ngModel)]="changePasswordData.new_password"
                            placeholder="Enter new password">

                        <button
                            type="button"
                            class="btn btn-outline-secondary"
                            (click)="showNewPassword = !showNewPassword">

                            <i
                                class="bi"
                                [class.bi-eye]="!showNewPassword"
                                [class.bi-eye-slash]="showNewPassword">
                            </i>

                        </button>

                    </div>

                    <small class="text-muted">
                        Password must contain at least 6 characters.
                    </small>

                </div>

                <!-- Confirm Password -->

                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Confirm New Password
                    </label>

                    <div class="input-group">

                        <input
                            [type]="showConfirmPassword ? 'text' : 'password'"
                            class="form-control"
                            [(ngModel)]="changePasswordData.new_password_confirmation"
                            placeholder="Confirm new password">

                        <button
                            type="button"
                            class="btn btn-outline-secondary"
                            (click)="showConfirmPassword = !showConfirmPassword">

                            <i
                                class="bi"
                                [class.bi-eye]="!showConfirmPassword"
                                [class.bi-eye-slash]="showConfirmPassword">
                            </i>

                        </button>

                    </div>

                </div>

            </div>

            <!-- Footer -->

            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Cancel

                </button>

                <button
                    type="button"
                    class="btn btn-primary"
                    (click)="changePassword()">

                    <i class="bi bi-check-circle me-1"></i>

                    Update Password

                </button>

            </div>

        </div>

    </div>

</div>
