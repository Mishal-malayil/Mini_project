<div class="container-fluid">

    <!-- Header -->
    <div class="page-header d-flex justify-content-between align-items-center">

        <div>
            <h3>Coordinators</h3>
            <p class="text-muted mb-0">
                Manage all event coordinators
            </p>
        </div>

        <button
            class="btn btn-primary"
            data-bs-toggle="modal"
            data-bs-target="#coordinatorModal">

            <i class="bi bi-plus-circle me-2"></i>
            Add Coordinator

        </button>

    </div>

    <!-- Table -->
    <div class="card">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table student-table table-hover">

                    <thead>

                        <tr>

                            <th>#</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Department</th>
                            <th>Designation</th>
                            <th class="text-center">Action</th>

                        </tr>

                    </thead>

                    <tbody>

                        <tr *ngFor="let coordinator of coordinators; let i=index">

                            <td>{{ i + 1 }}</td>

                            <td>
                                <strong>{{ coordinator.name }}</strong>
                            </td>

                            <td>{{ coordinator.email }}</td>

                            <td>{{ coordinator.phone }}</td>

                            <td>{{ coordinator.department }}</td>

                            <td>{{ coordinator.designation }}</td>

                            <td class="text-center">

                                <button
                                    class="btn btn-info btn-sm me-2"
                                    data-bs-toggle="modal"
                                    data-bs-target="#viewCoordinatorModal"
                                    (click)="viewCoordinator(coordinator.id)">

                                    <i class="bi bi-eye"></i>

                                </button>

                                <button
                                    class="btn btn-success btn-sm me-2"
                                    data-bs-toggle="modal"
                                    data-bs-target="#editCoordinatorModal"
                                    (click)="editCoordinator(coordinator.id)">

                                    <i class="bi bi-pencil"></i>

                                </button>

                                <button
                                    class="btn btn-danger btn-sm"
                                    (click)="deleteCoordinator(coordinator.id)">

                                    <i class="bi bi-trash"></i>

                                </button>

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>
