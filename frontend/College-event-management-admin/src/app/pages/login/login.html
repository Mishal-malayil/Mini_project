<div class="login-container">

    <div class="card shadow-lg login-card">

        <div class="card-body">

            <div class="text-center mb-4">

                <i class="bi bi-person-circle login-icon"></i>

                <h2 class="mt-3">
                    College Event Management
                </h2>

                <p class="text-muted">
                    Admin Login
                </p>

            </div>

            <form [formGroup]="loginForm" (ngSubmit)="login()">

                <div class="mb-3">

                    <label>Email</label>

                    <input type="email" class="form-control" formControlName="email" placeholder="Enter email">

                    @if(loginForm.controls['email'].touched &&
                    loginForm.controls['email'].invalid){

                    <small class="text-danger">

                        Valid email is required

                    </small>

                    }

                </div>

                <div class="mb-4">

                    <label>Password</label>

                    <input type="password" class="form-control" formControlName="password" placeholder="Enter password">

                    @if(loginForm.controls['password'].touched &&
                    loginForm.controls['password'].invalid){

                    <small class="text-danger">

                        Password is required

                    </small>

                    }

                </div>

                <button class="btn btn-primary w-100" [disabled]="loading || loginForm.invalid">

                    @if(loading){

                    <span class="spinner-border spinner-border-sm"></span>
                    Logging in...

                    } @else {

                    <i class="bi bi-box-arrow-in-right"></i>
                    Login

                    }

                </button>
                @if(errorMessage){

                <div class="alert alert-danger mt-3">

                    {{ errorMessage }}

                </div>

                }

            </form>

        </div>

    </div>

</div>
